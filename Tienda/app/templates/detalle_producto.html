<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ productos.nombre }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'main' %}">Tienda</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-6">
                {% if productos.imagen %}
                <img src="{{ productos.imagen }}" class="img-fluid rounded" alt="{{ productos.nombre }}">
                {% else %}
                <p>No hay imagen disponible.</p>
                {% endif %}
            </div>
            <div class="col-md-6">
                <h2>{{ productos.nombre }}</h2>
                <p><strong>Descripción:</strong> {{ productos.descripcion }}</p>
                <p><strong>Stock disponible:</strong> {{ productos.stock }}</p>
                <p><strong>Precio:</strong> ${{ productos.precio }}</p>
                <a href="{% url 'main' %}" class="btn btn-secondary mt-3">← Volver al inicio</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
